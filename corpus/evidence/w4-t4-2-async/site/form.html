<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TABI-R3-1 form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <h1 id="page-title">TABI-R3-1 travel form</h1>
  <form id="travel-form" action="confirm.html" method="get">
    <div class="row"><label for="traveler">traveler</label><input id="traveler" name="traveler" type="text" value=""></div>
    <div class="row">mode
      <label><input id="mode-rail" name="mode" type="radio" value="rail"> rail</label>
      <label><input id="mode-trail" name="mode" type="radio" value="trail"> trail</label>
    </div>
    <input id="item-field" name="item" type="hidden" value="none">
    <div class="row"><button id="submit" type="submit">submit</button></div>
  </form>
  <p><a id="back" href="detail.html?id=1">back to detail</a></p>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  if (id) document.getElementById('item-field').value = id;
})();
</script>
</body>
</html>
