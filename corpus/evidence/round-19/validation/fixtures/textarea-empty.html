<!doctype html>
<html>
<head><meta charset="utf-8"><title>round19 textarea-empty</title></head>
<body>
<form id="toolform" toolname="textarea-empty" tooldescription="Observe declarative textarea and text input value application" toolautosubmit>
  <label>Memo <textarea name="memo" id="memo" rows="4">pre-filled textarea</textarea></label>
  <label>Title <input type="text" name="title" id="title" value="pre-filled input"></label>
</form>
<script>
(function () {
  window.__obs = { calls: [] };
  var form = document.getElementById('toolform');

  form.addEventListener('submit', function (event) {
    var fields = Object.fromEntries(new FormData(event.target));
    window.__obs.calls.push({
      agentInvoked: event.agentInvoked === true,
      isTrusted: event.isTrusted,
      fields: fields
    });
    event.preventDefault();
    event.respondWith(Promise.resolve({ ok: true, fields: fields }));
  });
})();
</script>
</body>
</html>
