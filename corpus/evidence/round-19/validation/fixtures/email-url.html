<!doctype html>
<html>
<head><meta charset="utf-8"><title>round19 email and URL validation</title></head>
<body>
<form id="toolform" toolname="decl-email-url" tooldescription="Observe declared email and URL input validation" toolautosubmit>
  <label>Email <input id="email" type="email" name="email"></label>
  <label>URL <input id="url" type="url" name="url"></label>
  <button type="submit" id="go">Go</button>
</form>
<script>
(function () {
  window.__obs = { calls: [] };
  var form = document.getElementById('toolform');
  form.addEventListener('submit', function (event) {
    var fields = Object.fromEntries(new FormData(event.target));
    window.__obs.calls.push({
      agentInvoked: event.agentInvoked === true,
      isTrusted: event.isTrusted,
      fields: fields
    });
    event.preventDefault();
    event.respondWith(Promise.resolve({ ok: true, fields: fields }));
  });
})();
</script>
</body>
</html>
