<!doctype html>
<html>
<head><meta charset="utf-8"><title>round-19 select enum validation</title></head>
<body>
<form id="toolform" toolname="select-enum" tooldescription="Single select enum probe" toolautosubmit>
  <label for="choice">Choice</label>
  <select id="choice" name="choice">
    <option value="alpha-code" selected>Alpha label</option>
    <option value="beta-code">Beta visible label</option>
    <option value="disabled-code" disabled>Disabled visible label</option>
  </select>
</form>
<script>
(function () {
  window.__obs = { calls: [] };
  var form = document.getElementById('toolform');

  form.addEventListener('submit', function (event) {
    var fields = Object.fromEntries(new FormData(event.target));
    window.__obs.calls.push({
      agentInvoked: event.agentInvoked === true,
      isTrusted: event.isTrusted,
      fields: fields
    });
    event.preventDefault();
    event.respondWith(Promise.resolve({ ok: true, fields: fields }));
  });
})();
</script>
</body>
</html>
