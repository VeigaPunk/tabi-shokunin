<!doctype html>
<html>
<head><meta charset="utf-8"><title>round17 invoke declarative</title></head>
<body>
<h1>invoke-declarative</h1>
<form id="toolform" toolname="decl-form" tooldescription="Declarative form tool that responds through SubmitEvent.respondWith" toolautosubmit>
  <label>Query <input type="text" name="q"></label>
  <button type="submit" id="go">Go</button>
</form>
<script>
(function () {
  window.__obs = { calls: [] };
  var form = document.getElementById('toolform');

  form.addEventListener('submit', function (event) {
    var formData = new FormData(event.target);
    var q = formData.get('q');
    var obs = {
      kind: 'submit',
      agentInvoked: event.agentInvoked === true,
      isTrusted: event.isTrusted,
      ctor: event.constructor && event.constructor.name ? event.constructor.name : null,
      cancelable: event.cancelable,
      q: q,
      respondWithType: typeof event.respondWith,
      submitter: event.submitter ? (event.submitter.id || event.submitter.tagName) : null,
      toolFormActive: event.target && typeof event.target.matches === 'function'
        ? event.target.matches(':tool-form-active') : null,
      at: performance.now()
    };
    window.__obs.calls.push(obs);
    try {
      fetch('/__ledger', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ tool: 'decl-form', phase: 'submit', nonce: q, q: q })
      }).catch(function () {});
    } catch (error) { /* ledger is best-effort */ }
    // The result channel for agent-invoked declarative submissions in
    // Chromium 154: preventDefault + respondWith(promise). preventDefault
    // must come first; the order is pinned by the SubmitEvent spec.
    event.preventDefault();
    var returned = event.respondWith(Promise.resolve({ ok: true, q: q, via: 'respondWith' }));
    obs.respondWithReturnType = typeof returned;
  });
})();
</script>
</body>
</html>
